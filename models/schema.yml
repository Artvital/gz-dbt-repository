version: 2

sources:
   - name: raw
     description: the dataset for greenwez's valuable data
     schema: gz_raw_data
     tables:
       - name: sales
         description: sales data for greenweez
         identifier: raw_gz_sales

         loaded_at_field: "CAST(date_date AS TIMESTAMP)"
         freshness:
           warn_after: { count: 90, period: day }

         tests:
           - unique:
              column_name: "(orders_id || '-' || pdt_id)"
         columns:
         - name: date_date
           description: the date of order
         - name: orders_id
           description: together with product_id constitutes the primary key
         - name: pdt_id
           description: together with orders_id constitutes the primary key
         - name: revenue
           description: the turnover generated by the product
         - name: quantity
           description: the quantity ordered
       - name: product
         description: product data for greenweez
         identifier: raw_gz_product
         columns:
         - name: products_id
           description: the primary key of the product table
           tests:
            - unique
            - not_null           
         - name: purchase_price
           description: the purchase price of the product
       - name: ship
         description: shipment data for greenweez
         identifier: raw_gz_ship
         columns:
         - name: orders_id
           description: the primary key of the shipment table
           tests:
            - unique
            - not_null
         - name: shipping_fee
           description: the revenue generated by the order shipped
         - name: logcost
           description: the logistic cost of the shipment, shipping_fee minus logcost minus ship_cost will give the marginal cost  
         - name: ship_cost
           description: the shipment cost of the shipment, shipping_fee minus logcost minus ship_cost will give the marginal cost